name: Compilar Vigilante BT APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generar Iconos + Permisos de Red y Armar APK
        run: |
          pip install pillow
          mkdir -p app/src/main/java/com/vigilantebt/app
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-v31
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          cp MainActivity.java app/src/main/java/com/vigilantebt/app/MainActivity.java

          cat << 'EOF' > app/src/main/res/drawable/empty_splash.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="@android:color/transparent" />
              <size android:width="1dp" android:height="1dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.DeviceDefault.NoActionBar">
                  <item name="android:windowBackground">#18181B</item>
                  <item name="android:colorBackground">#18181B</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values-v31/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.DeviceDefault.NoActionBar">
                  <item name="android:windowBackground">#18181B</item>
                  <item name="android:colorBackground">#18181B</item>
                  <item name="android:windowSplashScreenBackground">#18181B</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/empty_splash</item>
                  <item name="android:windowSplashScreenIconBackgroundColor">@android:color/transparent</item>
              </style>
          </resources>
          EOF

          python3 - << 'PYEOF'
          import os, glob
          from PIL import Image, ImageDraw

          if os.path.exists("favicon.ico"):
              ico_img = Image.open("favicon.ico").convert("RGBA").resize((256, 256), Image.LANCZOS)
              ico_img.save("app/src/main/res/drawable/ic_header_logo.png", "PNG")

          imagenes = [
              f for f in (glob.glob("*.png") + glob.glob("*.jpg") + glob.glob("*.jpeg"))
              if "ic_launcher" not in f and "ic_header_logo" not in f
          ]

          icono_final = None

          if imagenes:
              img = Image.open(imagenes[0]).convert("RGBA")
              w, h = img.size
              pix = img.load()

              if h > w * 1.2:
                  y_top_band = int(h * 0.13)
                  y_bot_band = int(h * 0.62)
                  cx_scan = w // 2

                  min_y = y_top_band
                  for y in range(y_top_band, y_bot_band):
                      r, g, b, _ = pix[cx_scan, y]
                      if r > 200 and g > 200 and b > 200:
                          min_y = y
                          break

                  max_y = y_bot_band
                  for y in range(y_bot_band, y_top_band, -1):
                      r, g, b, _ = pix[cx_scan, y]
                      if r > 200 and g > 200 and b > 200:
                          max_y = y
                          break

                  cy_scan = (min_y + max_y) // 2
                  min_x = 0
                  for x in range(0, w):
                      r, g, b, _ = pix[x, cy_scan]
                      if r > 200 and g > 200 and b > 200:
                          min_x = x
                          break

                  max_x = w - 1
                  for x in range(w - 1, 0, -1):
                      r, g, b, _ = pix[x, cy_scan]
                      if r > 200 and g > 200 and b > 200:
                          max_x = x
                          break

                  diametro = max(max_x - min_x, max_y - min_y)
                  cx = (min_x + max_x) // 2
                  cy = (min_y + max_y) // 2
                  r_half = diametro // 2

                  crop_box = (
                      max(0, cx - r_half),
                      max(0, cy - r_half),
                      min(w, cx + r_half),
                      min(h, cy + r_half)
                  )
                  recorte = img.crop(crop_box).resize((512, 512), Image.LANCZOS)
              else:
                  lado = min(w, h)
                  left = (w - lado) // 2
                  top = (h - lado) // 2
                  recorte = img.crop((left, top, left + lado, top + lado)).resize((512, 512), Image.LANCZOS)

              mascara = Image.new("L", (512, 512), 0)
              draw_mask = ImageDraw.Draw(mascara)
              draw_mask.ellipse((8, 8, 504, 504), fill=255)

              icono_final = Image.new("RGBA", (512, 512), (0, 0, 0, 0))
              fondo_blanco = Image.new("RGBA", (512, 512), (255, 255, 255, 255))
              icono_final.paste(fondo_blanco, (0, 0), mascara)
              icono_final.paste(recorte, (0, 0), mascara)

          else:
              icono_final = Image.new("RGBA", (512, 512), (0, 0, 0, 0))
              d = ImageDraw.Draw(icono_final)
              d.ellipse((8, 8, 504, 504), fill=(255, 255, 255, 255))
              d.rounded_rectangle((190, 115, 440, 255), radius=65, fill=(245, 179, 22, 255))
              d.rounded_rectangle((45, 145, 320, 290), radius=65, fill=(26, 136, 201, 255))
              d.rounded_rectangle((165, 145, 320, 445), radius=70, fill=(26, 136, 201, 255))
              d.rounded_rectangle((190, 145, 320, 255), radius=45, fill=(227, 30, 36, 255))

          tamanos = {
              "app/src/main/res/drawable/ic_launcher.png": 256,
              "app/src/main/res/mipmap-mdpi/ic_launcher.png": 48,
              "app/src/main/res/mipmap-hdpi/ic_launcher.png": 72,
              "app/src/main/res/mipmap-xhdpi/ic_launcher.png": 96,
              "app/src/main/res/mipmap-xxhdpi/ic_launcher.png": 144,
              "app/src/main/res/mipmap-xxxhdpi/ic_launcher.png": 192,
          }
          for ruta, tam in tamanos.items():
              icono_final.resize((tam, tam), Image.LANCZOS).save(ruta, "PNG")
          PYEOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VigilanteBT"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.vigilantebt.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.vigilantebt.app"
                  minSdk 24
                  targetSdk 28
                  versionCode 7
                  versionName "1.6"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.EXPAND_STATUS_BAR" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="Vigilante BT"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name="com.vigilantebt.app.MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Compilar APK
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk VigilanteBT.apk

      - name: Subir VigilanteBT.apk listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: VigilanteBT-APK
          path: VigilanteBT.apk
